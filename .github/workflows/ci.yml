name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build regexped
        run: go build -o regexped .

      # Several tests validate the emitted module by shelling out to
      # `wasm-tools validate`. They SKIP when it is absent, so without this
      # step the suite still passes — while quietly checking nothing. The
      # modules it rejects are ones that only fail at load, which no Go
      # assertion catches.
      # An empty first argument is "this runner's architecture"; the second is
      # where to put it, and an existing DIRECTORY gets `wasm-tools` appended,
      # which is what puts it on PATH. release.yml passes both explicitly
      # instead, because the image needs each architecture under its own name.
      - name: Install wasm-tools
        run: ./docker/get_wasm_tools.sh "" /usr/local/bin

      - name: Run unit tests
        run: go test -coverprofile=coverage.out ./compile/... ./config/... ./generate/... ./merge/... ./internal/... ./component/...

      - name: Upload coverage reports to Codecov
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  re2-tests:
    name: RE2 test suite
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run RE2 test suite
        working-directory: tools/re2test
        run: make test
