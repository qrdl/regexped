# The `set-shufti-dense-harm` guard case, as a settest fixture.
#
# The same 21 [A-U]-prefixed patterns as shufti.yaml, pointed at input built to
# make Shufti LOSE: solid A-U with no gaps, so every SIMD chunk's bitmask is
# all-ones, ctz always returns 0, the skip loop can never advance more than one
# position, and every position falls through to the scalar membership tail.
#
# This is the input the runtime density switch (`shuftiAdaptive`) exists to
# rescue: it counts consecutive unproductive probes and disables the SIMD
# prefilter for the rest of the call. Run with `-force-frontend scalar` and
# `-adaptive on` against `-adaptive off` to measure whether the switch still
# earns its counter, flag and per-attempt branch.
patterns:
  - {name: pA, regexp: 'A1:[^\n]+'}
  - {name: pB, regexp: 'B1:[^\n]+'}
  - {name: pC, regexp: 'C1:[^\n]+'}
  - {name: pD, regexp: 'D1:[^\n]+'}
  - {name: pE, regexp: 'E1:[^\n]+'}
  - {name: pF, regexp: 'F1:[^\n]+'}
  - {name: pG, regexp: 'G1:[^\n]+'}
  - {name: pH, regexp: 'H1:[^\n]+'}
  - {name: pI, regexp: 'I1:[^\n]+'}
  - {name: pJ, regexp: 'J1:[^\n]+'}
  - {name: pK, regexp: 'K1:[^\n]+'}
  - {name: pL, regexp: 'L1:[^\n]+'}
  - {name: pM, regexp: 'M1:[^\n]+'}
  - {name: pN, regexp: 'N1:[^\n]+'}
  - {name: pO, regexp: 'O1:[^\n]+'}
  - {name: pP, regexp: 'P1:[^\n]+'}
  - {name: pQ, regexp: 'Q1:[^\n]+'}
  - {name: pR, regexp: 'R1:[^\n]+'}
  - {name: pS, regexp: 'S1:[^\n]+'}
  - {name: pT, regexp: 'T1:[^\n]+'}
  - {name: pU, regexp: 'U1:[^\n]+'}

sets:
  - name: dense_harm
    find: dense_harm_find
    patterns: all
