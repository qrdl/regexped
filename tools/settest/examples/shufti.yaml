# 21 literal-prefixed patterns with distinct uppercase first bytes [A..U].
#
# Shufti is reachable ONLY out of the scalar frontend branch, which in
# production needs Aho-Corasick to decline over its 512 KB table budget first.
# These 21 short literals would be picked up by Teddy instead, so the example
# target passes -force-frontend scalar to restore the intended A/B: neutral
# stays scalar (this literal set's rarity sum is 42 against the threshold of
# 40) and only prefer-no-match flips to Shufti.
#
# Read the deltas as an UPPER BOUND — 21 buckets inflate the prefilter's share
# of the work, and the absolute fuel here models no real workload.
patterns:
  - {name: pA, regexp: 'A1:[^\n]+'}
  - {name: pB, regexp: 'B1:[^\n]+'}
  - {name: pC, regexp: 'C1:[^\n]+'}
  - {name: pD, regexp: 'D1:[^\n]+'}
  - {name: pE, regexp: 'E1:[^\n]+'}
  - {name: pF, regexp: 'F1:[^\n]+'}
  - {name: pG, regexp: 'G1:[^\n]+'}
  - {name: pH, regexp: 'H1:[^\n]+'}
  - {name: pI, regexp: 'I1:[^\n]+'}
  - {name: pJ, regexp: 'J1:[^\n]+'}
  - {name: pK, regexp: 'K1:[^\n]+'}
  - {name: pL, regexp: 'L1:[^\n]+'}
  - {name: pM, regexp: 'M1:[^\n]+'}
  - {name: pN, regexp: 'N1:[^\n]+'}
  - {name: pO, regexp: 'O1:[^\n]+'}
  - {name: pP, regexp: 'P1:[^\n]+'}
  - {name: pQ, regexp: 'Q1:[^\n]+'}
  - {name: pR, regexp: 'R1:[^\n]+'}
  - {name: pS, regexp: 'S1:[^\n]+'}
  - {name: pT, regexp: 'T1:[^\n]+'}
  - {name: pU, regexp: 'U1:[^\n]+'}

sets:
  - name: prefixed
    find: prefixed_find
    patterns: all
