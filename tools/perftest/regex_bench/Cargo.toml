[package]
name = "regex_bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "regex_bench"

[dependencies]
regex = "1"
# Promoted from a transitive dependency of `regex` to a direct one so
# tools/setperf can benchmark the layer underneath the `regex` facade
# it presents.
regex-automata = "0.4"

[profile.release]
opt-level = 3
