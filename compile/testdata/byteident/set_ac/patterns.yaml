# Set frontend: AHO-CORASICK — >16 literals with LOW first-byte diversity
# (every literal starts 'k'), inside the 512 KB table budget. compile/aho_corasick.go.
patterns:
  - name: p0
    regexp: 'kw00'
  - name: p1
    regexp: 'kw01'
  - name: p2
    regexp: 'kw02'
  - name: p3
    regexp: 'kw03'
  - name: p4
    regexp: 'kw04'
  - name: p5
    regexp: 'kw05'
  - name: p6
    regexp: 'kw06'
  - name: p7
    regexp: 'kw07'
  - name: p8
    regexp: 'kw08'
  - name: p9
    regexp: 'kw09'
  - name: p10
    regexp: 'kw10'
  - name: p11
    regexp: 'kw11'
  - name: p12
    regexp: 'kw12'
  - name: p13
    regexp: 'kw13'
  - name: p14
    regexp: 'kw14'
  - name: p15
    regexp: 'kw15'
  - name: p16
    regexp: 'kw16'
  - name: p17
    regexp: 'kw17'
sets:
  - name: s
    find: s_find
    patterns: all
