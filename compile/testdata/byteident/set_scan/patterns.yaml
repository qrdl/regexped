# Capability shape: the SCAN pair (scan_any / scan_all) — non-anchored, taking
# an offset, no positions reported.
patterns:
  - name: p0
    regexp: 'Aqr00'
  - name: p1
    regexp: 'Bqr01'
  - name: p2
    regexp: 'Cqr02'
  - name: p3
    regexp: 'Dqr03'
  - name: p4
    regexp: 'Eqr04'
  - name: p5
    regexp: 'Fqr05'
  - name: p6
    regexp: 'Gqr06'
  - name: p7
    regexp: 'Hqr07'
sets:
  - name: s
    scan_any: s_scan_any
    scan_all: s_scan_all
    patterns: all
