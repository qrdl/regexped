# Set frontend: TEDDY — 17..64 literals with DIVERSE first bytes, nibble
# fingerprint tables. Diversity is what distinguishes this from set_ac: the same
# literal count with a shared first byte goes to Aho-Corasick instead.
patterns:
  - name: p0
    regexp: 'Aqr00'
  - name: p1
    regexp: 'Bqr01'
  - name: p2
    regexp: 'Cqr02'
  - name: p3
    regexp: 'Dqr03'
  - name: p4
    regexp: 'Eqr04'
  - name: p5
    regexp: 'Fqr05'
  - name: p6
    regexp: 'Gqr06'
  - name: p7
    regexp: 'Hqr07'
  - name: p8
    regexp: 'Iqr08'
  - name: p9
    regexp: 'Jqr09'
  - name: p10
    regexp: 'Kqr10'
  - name: p11
    regexp: 'Lqr11'
  - name: p12
    regexp: 'Mqr12'
  - name: p13
    regexp: 'Nqr13'
  - name: p14
    regexp: 'Oqr14'
  - name: p15
    regexp: 'Pqr15'
  - name: p16
    regexp: 'Qqr16'
  - name: p17
    regexp: 'Rqr17'
  - name: p18
    regexp: 'Sqr18'
  - name: p19
    regexp: 'Tqr19'
sets:
  - name: s
    find: s_find
    patterns: all
