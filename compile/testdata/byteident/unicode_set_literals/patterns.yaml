# A Unicode-mode set of multi-byte literals: their UTF-8 bytes reach the
# literal frontend.
regexps:
  - { name: k0, pattern: 'привет' }
  - { name: k1, pattern: 'москва' }
  - { name: k2, pattern: 'собака' }
  - { name: k3, pattern: 'город\d+' }
sets:
  - name: ul
    find: ul_find
    scan_all: ul_scan_all
    patterns: all
