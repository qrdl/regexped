# Capability shape: the ANCHORED pair alone (match_any / match_all). The
# compiler emits only the machinery a set's declared capabilities need, so an
# anchored-only set emits NO literal frontend at all — which is the thing this
# pins.
patterns:
  - name: p0
    regexp: 'Aqr00'
  - name: p1
    regexp: 'Bqr01'
  - name: p2
    regexp: 'Cqr02'
  - name: p3
    regexp: 'Dqr03'
  - name: p4
    regexp: 'Eqr04'
  - name: p5
    regexp: 'Fqr05'
  - name: p6
    regexp: 'Gqr06'
  - name: p7
    regexp: 'Hqr07'
sets:
  - name: s
    match_any: s_match_any
    match_all: s_match_all
    patterns: all
