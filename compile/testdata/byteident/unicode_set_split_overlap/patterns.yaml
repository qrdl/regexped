# A Unicode-mode overlapping set that splits a member which can match empty: the
# merge rounds its search position up to a character's first byte, and its
# program sweep answers -1 inside a character. Its members are ASCII, so the
# set-level key is what puts it in Unicode mode.
patterns:
  - { name: s0, regexp: 'foo\w+' }
  - { name: s1, regexp: '(?:a[^z]*?z)?' }
sets:
  - name: us
    find: us_find
    overlapping: true
    unicode: true
    patterns: all
