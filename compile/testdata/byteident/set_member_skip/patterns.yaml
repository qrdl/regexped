# Member self-loop skip: 40 shared-literal patterns packing into ONE sparse
# bucket whose body states each self-loop on a single byte, compiled with
# prefer-match so the skip is emitted.
#
# The only fixture that pins the skip's bytes. set_sparse pins the same body
# WITHOUT it (neutral), so the pair is what separates "the sparse body changed"
# from "the skip changed".
patterns:
  - {name: p00, regexp: 'union[ \t]+k00a+'}
  - {name: p01, regexp: 'union[ \t]+k01a+'}
  - {name: p02, regexp: 'union[ \t]+k02a+'}
  - {name: p03, regexp: 'union[ \t]+k03a+'}
  - {name: p04, regexp: 'union[ \t]+k04a+'}
  - {name: p05, regexp: 'union[ \t]+k05a+'}
  - {name: p06, regexp: 'union[ \t]+k06a+'}
  - {name: p07, regexp: 'union[ \t]+k07a+'}
  - {name: p08, regexp: 'union[ \t]+k08a+'}
  - {name: p09, regexp: 'union[ \t]+k09a+'}
  - {name: p10, regexp: 'union[ \t]+k10a+'}
  - {name: p11, regexp: 'union[ \t]+k11a+'}
  - {name: p12, regexp: 'union[ \t]+k12a+'}
  - {name: p13, regexp: 'union[ \t]+k13a+'}
  - {name: p14, regexp: 'union[ \t]+k14a+'}
  - {name: p15, regexp: 'union[ \t]+k15a+'}
  - {name: p16, regexp: 'union[ \t]+k16a+'}
  - {name: p17, regexp: 'union[ \t]+k17a+'}
  - {name: p18, regexp: 'union[ \t]+k18a+'}
  - {name: p19, regexp: 'union[ \t]+k19a+'}
  - {name: p20, regexp: 'union[ \t]+k20a+'}
  - {name: p21, regexp: 'union[ \t]+k21a+'}
  - {name: p22, regexp: 'union[ \t]+k22a+'}
  - {name: p23, regexp: 'union[ \t]+k23a+'}
  - {name: p24, regexp: 'union[ \t]+k24a+'}
  - {name: p25, regexp: 'union[ \t]+k25a+'}
  - {name: p26, regexp: 'union[ \t]+k26a+'}
  - {name: p27, regexp: 'union[ \t]+k27a+'}
  - {name: p28, regexp: 'union[ \t]+k28a+'}
  - {name: p29, regexp: 'union[ \t]+k29a+'}
  - {name: p30, regexp: 'union[ \t]+k30a+'}
  - {name: p31, regexp: 'union[ \t]+k31a+'}
  - {name: p32, regexp: 'union[ \t]+k32a+'}
  - {name: p33, regexp: 'union[ \t]+k33a+'}
  - {name: p34, regexp: 'union[ \t]+k34a+'}
  - {name: p35, regexp: 'union[ \t]+k35a+'}
  - {name: p36, regexp: 'union[ \t]+k36a+'}
  - {name: p37, regexp: 'union[ \t]+k37a+'}
  - {name: p38, regexp: 'union[ \t]+k38a+'}
  - {name: p39, regexp: 'union[ \t]+k39a+'}

sets:
  - name: member
    find: member_find
    patterns: all
    hints: [prefer-match]
