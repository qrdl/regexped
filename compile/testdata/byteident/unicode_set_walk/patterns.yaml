# A Unicode-mode set whose fallback bucket holds members that can match empty
# inside a character: the per-position walk skips candidates there, in `find`
# and in the scan pair (\B), and the first-byte tables hold lead bytes.
patterns:
  - { name: letters, regexp: '[a-zé]+' }
  - { name: xs, regexp: 'x*' }
  - { name: nwb, regexp: '\B' }
sets:
  - name: uw
    find: uw_find
    scan_any: uw_scan_any
    scan_all: uw_scan_all
    patterns: all
