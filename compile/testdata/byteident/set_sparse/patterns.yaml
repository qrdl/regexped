# SPARSE ACCEPT — 40 patterns sharing one literal, so they pack into a
# SINGLE bucket. A u64 accept mask caps a bucket at 32 patterns; the sparse
# representation carries per-state LISTS of pattern indices instead, which is
# what lets one bucket hold more. compile/set_sparse.go.
#
# Verified by the diagnostics rather than assumed: this fixture's one bucket
# reports accept_kind "sparse", every other set fixture reports "bitmask".
patterns:
  - name: p0
    regexp: 'SHARED[a-z]{2}00'
  - name: p1
    regexp: 'SHARED[a-z]{2}01'
  - name: p2
    regexp: 'SHARED[a-z]{2}02'
