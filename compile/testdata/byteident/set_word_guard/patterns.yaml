# Members whose part before their literal is a bare `\b` or `\B`: each keeps its
# LITERAL bucket with a word guard (PatternInfo.wordGuard) — the bucket's
# trivial-prefix group tests the boundary between input[pos-1] and input[pos]
# through a 256-byte word table, instead of the member walking a fallback
# bucket at every position. `ab` carries three members with three guards
# (`\b`, `\B`, none), so one group mixes guarded and unguarded bits; `\b-x`
# starts with a non-word byte.
patterns:
  - name: p0
    regexp: '\bselect\b'
  - name: p1
    regexp: '\Bing\b'
  - name: p2
    regexp: '\b-x'
  - name: p3
    regexp: '\bab'
  - name: p4
    regexp: '\Bab'
  - name: p5
    regexp: 'ab'
sets:
  - name: s
    find: s_find
    scan_any: s_scan_any
    scan_all: s_scan_all
    patterns: all
