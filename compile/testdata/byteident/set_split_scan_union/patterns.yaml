# Members split out of the buckets, and a start-anywhere union over EVERY
# member that serves the scan pair on its own: the scan bodies are the union
# walk, and only `find` is a merge wrapper.
regexps:
  - name: p0
    pattern: '[a-z]+0[0-9]+'
  - name: p1
    pattern: 'foo'
sets:
  - name: s
    find: s_find
    scan_any: s_scan_any
    scan_all: s_scan_all
    patterns: all
