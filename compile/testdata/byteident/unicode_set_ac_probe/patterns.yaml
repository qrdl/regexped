# A Unicode-mode set of 22 keywords on three first characters, every one
# beginning with a UTF-8 lead byte: Aho-Corasick with the two-column root
# probe and the per-candidate verify (eligible and ineligible literals).
patterns:
  - { name: k00, regexp: 'пример' }
  - { name: k01, regexp: 'при' }
  - { name: k02, regexp: 'рим' }
  - { name: k03, regexp: 'мер' }
  - { name: k04, regexp: 'пром' }
  - { name: k05, regexp: 'промокашка' }
  - { name: k06, regexp: 'мок' }
  - { name: k07, regexp: 'пирог' }
  - { name: k08, regexp: 'рог' }
  - { name: k09, regexp: 'почтальон' }
  - { name: k10, regexp: 'почтамт' }
  - { name: k11, regexp: 'пирамида' }
  - { name: k12, regexp: 'рам' }
  - { name: k13, regexp: 'правда' }
  - { name: k14, regexp: 'письмо' }
  - { name: k15, regexp: 'птица' }
  - { name: k16, regexp: 'пустота' }
  - { name: k17, regexp: 'печать' }
  - { name: k18, regexp: 'поле' }
  - { name: k19, regexp: 'палец' }
  - { name: k20, regexp: 'песок' }
  - { name: k21, regexp: 'плита' }
sets:
  - name: ac
    find: ac_find
    scan_all: ac_scan_all
    patterns: all
