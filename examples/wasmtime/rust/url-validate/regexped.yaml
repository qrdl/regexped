output:       "final.wasm"
wasm_file:    "url_validate.wasm"
import_module: "url_validate"
stub_file:    "stub.rs"

# The URL grammar is built from named pieces, each written once and used by
# reference: (?&name) inserts the regexp of the pattern called `name`. A piece
# has no *_func, so it compiles to nothing of its own; only match_url is
# exported. See docs/references.md.
patterns:
  # 0..255, one dotted part of an IPv4 address.
  - name: octet
    regexp: '25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?'
  - name: ipv4
    regexp: '(?&octet)\.(?&octet)\.(?&octet)\.(?&octet)'

  # One 16-bit group of an IPv6 address, and the address in all its
  # `::`-compressed forms.
  - name: h16
    regexp: '[0-9a-fA-F]{1,4}'
  - name: ipv6
    regexp: |-
      (?:(?&h16):){7}(?&h16)|(?:(?&h16):){1,7}:|:(?::(?&h16)){1,7}|(?:(?&h16):){1,6}:(?&h16)|(?:(?&h16):){1,5}(?::(?&h16)){1,2}|(?:(?&h16):){1,4}(?::(?&h16)){1,3}|(?:(?&h16):){1,3}(?::(?&h16)){1,4}|(?:(?&h16):){1,2}(?::(?&h16)){1,5}|(?&h16):(?::(?&h16)){1,6}|::

  # A host name: dot-separated labels, each starting and ending with a
  # letter or digit.
  - name: label
    regexp: '[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?'
  - name: hostname
    regexp: '(?&label)(?:\.(?&label))*'

  # 0..65535.
  - name: port
    regexp: '[0-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]'

  - name: userinfo
    regexp: |-
      [a-zA-Z0-9._~!$&'()*+,;=:-]+
  # Path, query and fragment, from the first `/`, `?` or `#`.
  - name: rest
    regexp: |-
      [/?#][/a-zA-Z0-9._~!$&'()*+,;=:@%?#-]*

  - regexp: '[Hh][Tt][Tt][Pp][Ss]?://(?:(?&userinfo)@)?(?:(?&ipv4)|\[(?&ipv6)\]|(?&hostname))(?::(?&port))?(?&rest)?'
    match_func:    "match_url"
