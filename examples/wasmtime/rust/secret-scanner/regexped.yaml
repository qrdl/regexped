wasm_file:     "secrets.wasm"
import_module: "secrets"

patterns:
  - name: aws_key
    regexp: 'AKIA[0-9A-Z]{16}'

  - name: aws_secret
    regexp: 'aws_secret_access_key\s*=\s*[0-9a-zA-Z/+]{40}'

  - name: github_pat
    regexp: 'ghp_[0-9a-zA-Z]{36}'

  - name: github_oauth
    regexp: 'gho_[0-9a-zA-Z]{36}'

  - name: github_app
    regexp: 'ghu_[0-9a-zA-Z]{36}'

  - name: jwt
    regexp: 'eyJ[0-9a-zA-Z_\-]{20,}\.[0-9a-zA-Z_\-]{20,}\.'

  - name: slack_token
    regexp: 'xox[baprs]-[0-9a-zA-Z\-]{10,}'

  - name: stripe_live
    regexp: 'sk_live_[0-9a-zA-Z]{24,}'

  - name: stripe_test
    regexp: 'sk_test_[0-9a-zA-Z]{24,}'

  - name: google_api
    regexp: 'AIza[0-9A-Za-z\-_]{35}'

sets:
  - name: scanner
    find: scan_secrets
    emit_name_map: true
    patterns: "all"
