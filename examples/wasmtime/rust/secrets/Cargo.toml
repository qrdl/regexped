[package]
name = "secrets"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "secrets"
path = "main.rs"

# A NATIVE binary, unlike the module-format examples: it embeds wasmtime and
# loads the component, rather than being compiled to wasm32-wasip1 and merged
# into the regexp module.
[dependencies]
wasmtime = "36"
anyhow = "1"
