[package]
name = "secrets"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "secrets"
path = "main.rs"

# A GUEST component, built for wasm32-wasip2 and composed with the regexp
# component by `wac`. The generated stub needs wit-bindgen: a component consumer
# cannot declare its imports by hand, because wasm32-wasip2 requires the
# component-type metadata this macro embeds.
[dependencies]
wit-bindgen = "0.61"
