# A Component Model component, consumed through a REGEXPED-GENERATED stub.
#
# `output:` is the `regexped merge` target for BOTH output kinds: under
# wasm_format: component it names what `wac plug` composes the guest and this
# component into, exactly as it names the wasm-merge target for a module. What a
# component does NOT take from it is the memory mode — a component always owns
# and exports its own memory, so the standalone-vs-embedded choice `output:`
# drives for modules is not made here.
#
# `stub_file:` IS set: the stub's API is identical to the module-format one, so
# main.rs reads the same either way.
#
# `import_module` names the WIT package and world, so this builds
# `package regexped:secrets;` with `world secrets`.
wasm_format:   component
import_module: "secrets"
wasm_file:     "secrets.wasm"
output:        "composed.wasm"
stub_file:     "stubs.rs"

regexps:
  - pattern:   'ghp_[A-Za-z0-9]{36}'
    find_func: "find_github_token"

  - pattern:   'eyJ[A-Za-z0-9+/\-_]+\.[A-Za-z0-9+/\-_]+\.[A-Za-z0-9+/\-_]+'
    find_func: "find_jwt_token"

  - pattern:   'AKIA[A-Z0-9]{16}'
    find_func: "find_aws_key"
