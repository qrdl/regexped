output:        "final.wasm"
wasm_file:     "url_parts.wasm"
import_module: "url_parts"
stub_file:     "stub.h"

patterns:
  - regexp:          '(?<scheme>https?)://(?<host>[^/:?#\s]+)(?::(?<port>[0-9]+))?(?<path>/[^?#\s]*)?(?:\?(?<query>[^#\s]*))?(?:#(?<fragment>[^\s]*))?'
    groups_func: "parse_url"
