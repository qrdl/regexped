wasm_file:     "patterns.wasm"
import_module: "sql"
stub_file:     "stubs.ts"

patterns:
  - name: "select"
    regexp: 'SELECT\s+.+\s+FROM\s+\w[\w.]*(\s+.*)?'

  - name: "insert"
    regexp: 'INSERT\s+INTO\s+\w[\w.]*\s*(?:\([^)]*\)\s*)?VALUES\s*\(.*\)(\s+.*)?'

  - name: "update"
    regexp: 'UPDATE\s+\w[\w.]*\s+SET\s+\w.*'

  - name: "delete"
    regexp: 'DELETE\s+FROM\s+\w[\w.]*(\s+.*)?'

sets:
  - name: "sql"
    match_any: "validate_sql"
    emit_name_map: true
    patterns: ["select", "insert", "update", "delete"]
