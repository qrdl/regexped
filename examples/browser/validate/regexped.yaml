wasm_file:     "regexps.wasm"
import_module: "regexps"
stub_file:     "regexp.js"

patterns:
  # An e-mail address and a URL both carry a host name: written once, and
  # used by both through a reference, (?&hostname). With no *_func it
  # compiles to nothing of its own.
  - name: hostname
    regexp: '[a-zA-Z0-9.\-]+\.[a-zA-Z]{2,}'

  - regexp:    '[a-zA-Z0-9._%+\-]+@(?&hostname)'
    match_func: "email_match"

  - regexp:    'https?://(?&hostname)(/[^\s]*)?'
    match_func: "url_match"
